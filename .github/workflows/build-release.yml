name: Build and release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore locked dependencies
        run: dotnet restore Tests/DiscordStatus.RegressionTests.csproj --locked-mode
      - name: Run fault-injection regression tests
        run: |
          ulimit -c 0
          dotnet run --project Tests -c Release --no-restore
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Build plugin (upstream net7.0 target)
        run: dotnet build Source/DiscordStatus.csproj -c Release --no-restore -o .artifacts/plugin
      - name: Validate tag version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 -c 'import os,xml.etree.ElementTree as E; assert os.environ["RELEASE_TAG"] == "v" + E.parse("Source/DiscordStatus.csproj").findtext(".//Version"), "Tag/version mismatch"'
      - name: Package pinned runtime and matching source
        run: python3 scripts/package.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DiscordStatus-release
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/') && github.repository == 'ZdravkoChiflishki/DiscordStatus'
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: DiscordStatus-release
          path: dist
      - name: Publish prerelease (does not deploy game servers)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/* --verify-tag --prerelease \
            --title "DiscordStatus $RELEASE_TAG — crash containment candidate" \
            --notes "Contains Discord HTTP failures at game callback boundaries, keeps upstream v3.2.2 runtime dependencies, and includes fault-injection coverage. SHA256SUMS and matching GPL-3.0 source are attached. Native CounterStrikeSharp loading and real Discord delivery have not yet been verified. Publishing this release does not deploy it to CS2."
